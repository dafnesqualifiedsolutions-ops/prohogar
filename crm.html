<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProHogar CRM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f7fa; color: #1a2733; padding: 20px; }
  h1 { font-size: 1.5rem; margin-bottom: 20px; color: #1C3F60; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { padding: 10px 18px; background: #fff; border: 1px solid #e3e9ee; border-radius: 8px; cursor: pointer; font-weight: 600; color: #586471; }
  .tab.active { background: #1C3F60; color: #fff; border-color: #1C3F60; }
  .panel { display: none; }
  .panel.active { display: block; }
  .form { background: #fff; padding: 18px; border-radius: 12px; border: 1px solid #e3e9ee; margin-bottom: 20px; }
  .form h3 { font-size: 1rem; margin-bottom: 12px; color: #1C3F60; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-row input, .form-row select, .form-row textarea { flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid #e3e9ee; border-radius: 8px; font-size: .9rem; }
  .form-row textarea { min-height: 60px; resize: vertical; }
  button[type="submit"] { background: #1C3F60; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  button[type="submit"]:hover { background: #152C44; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #e3e9ee; }
  th, td { padding: 12px; text-align: left; font-size: .85rem; border-bottom: 1px solid #e3e9ee; }
  th { background: #1C3F60; color: #fff; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: .75rem; font-weight: 600; }
  .status.new { background: #dbeafe; color: #1e40af; }
  .status.contacted { background: #fef3c7; color: #92400e; }
  .status.interested { background: #d1fae5; color: #065f46; }
  .status.client { background: #10b981; color: #fff; }
  .status.lost { background: #fee2e2; color: #991b1b; }
  .actions { display: flex; gap: 6px; }
  .actions button { background: none; border: 1px solid #e3e9ee; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: .8rem; }
  .actions button:hover { background: #f5f7fa; }
  .empty { text-align: center; padding: 40px; color: #8b8b93; }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: #fff; padding: 14px 18px; border-radius: 10px; border: 1px solid #e3e9ee; flex: 1; min-width: 140px; }
  .stat-num { font-size: 1.4rem; font-weight: 700; color: #1C3F60; }
  .stat-label { font-size: .75rem; color: #586471; margin-top: 2px; }
</style>
</head>
<body>
  <h1>ProHogar CRM</h1>

  <div class="tabs">
    <button class="tab active" data-tab="leads">Leads</button>
    <button class="tab" data-tab="partners">Partners</button>
    <button class="tab" data-tab="clients">Clients</button>
  </div>

  <!-- LEADS -->
  <div class="panel active" id="panel-leads">
    <div class="stats" id="leads-stats"></div>
    <div class="form">
      <h3>Add Lead</h3>
      <form id="lead-form">
        <div class="form-row">
          <input type="text" id="lead-name" placeholder="Name *" required />
          <input type="text" id="lead-business" placeholder="Business name *" required />
          <input type="tel" id="lead-phone" placeholder="Phone / WhatsApp *" required />
        </div>
        <div class="form-row">
          <select id="lead-source">
            <option value="">Source...</option>
            <option>Website form</option>
            <option>WhatsApp</option>
            <option>Phone call</option>
            <option>Referral</option>
            <option>Chat widget</option>
            <option>Other</option>
          </select>
          <select id="lead-status">
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="interested">Interested</option>
            <option value="client">Converted</option>
            <option value="lost">Lost</option>
          </select>
        </div>
        <div class="form-row">
          <textarea id="lead-notes" placeholder="Notes (optional)"></textarea>
        </div>
        <button type="submit">Add Lead</button>
      </form>
    </div>
    <div id="leads-table"></div>
  </div>

  <!-- PARTNERS -->
  <div class="panel" id="panel-partners">
    <div class="stats" id="partners-stats"></div>
    <div class="form">
      <h3>Add Partner</h3>
      <form id="partner-form">
        <div class="form-row">
          <input type="text" id="partner-name" placeholder="Full name *" required />
          <input type="email" id="partner-email" placeholder="Email *" required />
          <input type="tel" id="partner-phone" placeholder="Phone / WhatsApp" />
        </div>
        <div class="form-row">
          <textarea id="partner-notes" placeholder="Notes (background, how you met, etc.)"></textarea>
        </div>
        <button type="submit">Add Partner</button>
      </form>
    </div>
    <div id="partners-table"></div>
  </div>

  <!-- CLIENTS -->
  <div class="panel" id="panel-clients">
    <div class="stats" id="clients-stats"></div>
    <div class="form">
      <h3>Add Client</h3>
      <form id="client-form">
        <div class="form-row">
          <input type="text" id="client-business" placeholder="Business name *" required />
          <input type="text" id="client-contact" placeholder="Contact name" />
          <input type="tel" id="client-phone" placeholder="Phone / WhatsApp" />
        </div>
        <div class="form-row">
          <select id="client-partner">
            <option value="">Partner (who sold it)...</option>
          </select>
          <input type="date" id="client-start" />
        </div>
        <div class="form-row">
          <input type="number" id="client-setup" placeholder="Setup fee (£)" step="0.01" />
          <input type="number" id="client-monthly" placeholder="Monthly fee (£)" step="0.01" />
        </div>
        <div class="form-row">
          <select id="client-status">
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <textarea id="client-notes" placeholder="Notes"></textarea>
        </div>
        <button type="submit">Add Client</button>
      </form>
    </div>
    <div id="clients-table"></div>
  </div>

<script>
  // Simple localStorage CRM — no server, no cost
  var DB = {
    leads: JSON.parse(localStorage.getItem('ph_crm_leads') || '[]'),
    partners: JSON.parse(localStorage.getItem('ph_crm_partners') || '[]'),
    clients: JSON.parse(localStorage.getItem('ph_crm_clients') || '[]')
  };
  function save() {
    localStorage.setItem('ph_crm_leads', JSON.stringify(DB.leads));
    localStorage.setItem('ph_crm_partners', JSON.stringify(DB.partners));
    localStorage.setItem('ph_crm_clients', JSON.stringify(DB.clients));
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function fmt(n) { return n ? '£' + Number(n).toFixed(2) : '—'; }
  function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }

  // Tabs
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      render();
    });
  });

  // Forms
  document.getElementById('lead-form').addEventListener('submit', function(e) {
    e.preventDefault();
    DB.leads.unshift({
      id: uid(), name: document.getElementById('lead-name').value.trim(),
      business: document.getElementById('lead-business').value.trim(),
      phone: document.getElementById('lead-phone').value.trim(),
      source: document.getElementById('lead-source').value,
      status: document.getElementById('lead-status').value,
      notes: document.getElementById('lead-notes').value.trim(),
      created: new Date().toISOString()
    });
    save(); this.reset(); render();
  });
  document.getElementById('partner-form').addEventListener('submit', function(e) {
    e.preventDefault();
    DB.partners.unshift({
      id: uid(), name: document.getElementById('partner-name').value.trim(),
      email: document.getElementById('partner-email').value.trim(),
      phone: document.getElementById('partner-phone').value.trim(),
      notes: document.getElementById('partner-notes').value.trim(),
      created: new Date().toISOString(), status: 'active'
    });
    save(); this.reset(); render();
  });
  document.getElementById('client-form').addEventListener('submit', function(e) {
    e.preventDefault();
    DB.clients.unshift({
      id: uid(), business: document.getElementById('client-business').value.trim(),
      contact: document.getElementById('client-contact').value.trim(),
      phone: document.getElementById('client-phone').value.trim(),
      partnerId: document.getElementById('client-partner').value,
      startDate: document.getElementById('client-start').value,
      setupFee: parseFloat(document.getElementById('client-setup').value) || 0,
      monthlyFee: parseFloat(document.getElementById('client-monthly').value) || 0,
      status: document.getElementById('client-status').value,
      notes: document.getElementById('client-notes').value.trim(),
      created: new Date().toISOString()
    });
    save(); this.reset(); render();
  });

  function statusLabel(s) {
    var labels = { new: 'New', contacted: 'Contacted', interested: 'Interested', client: 'Converted', lost: 'Lost', active: 'Active', paused: 'Paused', cancelled: 'Cancelled' };
    return labels[s] || s;
  }

  function render() {
    // Leads
    var ls = DB.leads;
    var leadsHtml = '<table><thead><tr><th>Name</th><th>Business</th><th>Phone</th><th>Source</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>';
    if (!ls.length) leadsHtml += '<tr><td colspan="7" class="empty">No leads yet</td></tr>';
    else ls.forEach(function(l) {
      leadsHtml += '<tr><td>' + l.name + '</td><td>' + l.business + '</td><td>' + l.phone + '</td><td>' + (l.source || '—') + '</td><td><span class="status ' + l.status + '">' + statusLabel(l.status) + '</span></td><td>' + fmtDate(l.created) + '</td><td class="actions"><button onclick="updateLeadStatus(\'' + l.id + '\')">Status</button><button onclick="deleteLead(\'' + l.id + '\')">Delete</button></td></tr>';
    });
    leadsHtml += '</tbody></table>';
    document.getElementById('leads-table').innerHTML = leadsHtml;

    // Partners
    var ps = DB.partners;
    var partnersHtml = '<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Added</th><th>Actions</th></tr></thead><tbody>';
    if (!ps.length) partnersHtml += '<tr><td colspan="5" class="empty">No partners yet</td></tr>';
    else ps.forEach(function(p) {
      partnersHtml += '<tr><td>' + p.name + '</td><td>' + p.email + '</td><td>' + (p.phone || '—') + '</td><td>' + fmtDate(p.created) + '</td><td class="actions"><button onclick="deletePartner(\'' + p.id + '\')">Delete</button></td></tr>';
    });
    partnersHtml += '</tbody></table>';
    document.getElementById('partners-table').innerHTML = partnersHtml;

    // Clients
    var cs = DB.clients;
    var totalMonthly = cs.filter(function(c){ return c.status === 'active'; }).reduce(function(s,c){ return s + (c.monthlyFee || 0); }, 0);
    var totalSetup = cs.reduce(function(s,c){ return s + (c.setupFee || 0); }, 0);
    var activeClients = cs.filter(function(c){ return c.status === 'active'; }).length;
    document.getElementById('clients-stats').innerHTML = '<div class="stat"><div class="stat-num">' + activeClients + '</div><div class="stat-label">Active clients</div></div><div class="stat"><div class="stat-num">' + fmt(totalMonthly) + '</div><div class="stat-label">Monthly revenue</div></div><div class="stat"><div class="stat-num">' + fmt(totalSetup) + '</div><div class="stat-label">Total setup collected</div></div>';

    var clientsHtml = '<table><thead><tr><th>Business</th><th>Contact</th><th>Partner</th><th>Start</th><th>Setup</th><th>Monthly</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
    if (!cs.length) clientsHtml += '<tr><td colspan="8" class="empty">No clients yet</td></tr>';
    else cs.forEach(function(c) {
      var partner = DB.partners.find(function(p){ return p.id === c.partnerId; });
      clientsHtml += '<tr><td>' + c.business + '</td><td>' + (c.contact || '—') + '</td><td>' + (partner ? partner.name : '—') + '</td><td>' + fmtDate(c.startDate) + '</td><td>' + fmt(c.setupFee) + '</td><td>' + fmt(c.monthlyFee) + '</td><td><span class="status ' + c.status + '">' + statusLabel(c.status) + '</span></td><td class="actions"><button onclick="deleteClient(\'' + c.id + '\')">Delete</button></td></tr>';
    });
    clientsHtml += '</tbody></table>';
    document.getElementById('clients-table').innerHTML = clientsHtml;

    // Populate partner dropdown
    var sel = document.getElementById('client-partner');
    sel.innerHTML = '<option value="">Partner (who sold it)...</option>';
    DB.partners.forEach(function(p) { sel.innerHTML += '<option value="' + p.id + '">' + p.name + '</option>'; });

    // Stats
    var newCount = ls.filter(function(l){ return l.status === 'new'; }).length;
    document.getElementById('leads-stats').innerHTML = '<div class="stat"><div class="stat-num">' + ls.length + '</div><div class="stat-label">Total leads</div></div><div class="stat"><div class="stat-num">' + newCount + '</div><div class="stat-label">New leads</div></div>';
    document.getElementById('partners-stats').innerHTML = '<div class="stat"><div class="stat-num">' + ps.length + '</div><div class="stat-label">Total partners</div></div>';
  }

  window.updateLeadStatus = function(id) {
    var lead = DB.leads.find(function(l){ return l.id === id; });
    if (!lead) return;
    var next = { new: 'contacted', contacted: 'interested', interested: 'client', client: 'client', lost: 'lost' };
    lead.status = next[lead.status] || 'new';
    save(); render();
  };
  window.deleteLead = function(id) { if (confirm('Delete this lead?')) { DB.leads = DB.leads.filter(function(l){ return l.id !== id; }); save(); render(); } };
  window.deletePartner = function(id) { if (confirm('Delete this partner?')) { DB.partners = DB.partners.filter(function(p){ return p.id !== id; }); save(); render(); } };
  window.deleteClient = function(id) { if (confirm('Delete this client?')) { DB.clients = DB.clients.filter(function(c){ return c.id !== id; }); save(); render(); } };

  render();
</script>
</body>
</html>
